[project]
name = "pinchana-shorts"
version = "26.9.1"
description = "YouTube Shorts scraper service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pinchana-core",
    "yt-dlp>=2026.8.19",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "tenacity>=9.1.4",
    "uvicorn>=0.52.4",
]

[tool.uv.sources]
pinchana-core = { path = "../pinchana-core" }

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
