[project]
name = "pinchana-shorts"
version = "0.2b0"
description = "YouTube Shorts scraper service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pinchana-core",
    "yt-dlp>=2026.7.4",
    "fastapi>=0.140.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "tenacity>=9.1.4",
    "uvicorn>=0.51.0",
]

[tool.uv.sources]
pinchana-core = { path = "../pinchana-core" }

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
