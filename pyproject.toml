[project]
name = "pinchana-shorts"
version = "26.10.1"
description = "YouTube Shorts scraper service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pinchana-core",
    "yt-dlp>=2026.8.19",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "tenacity>=9.2.1",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
pinchana-core = { path = "../pinchana-core" }

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
